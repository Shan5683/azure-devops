name: dev-pipeline

on:
  workflow_dispatch:    # to trigger workflow manually

jobs:
  terraform-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: terraform setup
        uses: hashicorp/setup-terraform@v2  
        id: 1.6.0
      - name: terraform init
        run: terraform init
      - name: terraform validate
        run: terraform validate
      
    
 